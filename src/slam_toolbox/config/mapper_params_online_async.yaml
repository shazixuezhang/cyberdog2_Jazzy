slam_toolbox:
  ros__parameters:

    # ==================== 插件参数 ====================
    # 求解器插件配置
    solver_plugin: solver_plugins::CeresSolver          # 使用 Ceres 求解器插件
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY         # 线性求解器类型：稀疏正态乔列斯基分解
    ceres_preconditioner: SCHUR_JACOBI                  # 预条件器：舒尔补雅可比
    ceres_trust_strategy: LEVENBERG_MARQUARDT           # 信任域策略：列文伯格-马夸尔特算法
    ceres_dogleg_type: TRADITIONAL_DOGLEG               # Dogleg 类型：传统 Dogleg 方法
    ceres_loss_function: None                           # 损失函数：无（使用最小二乘）

    # ==================== ROS 参数 ====================
    odom_frame: vodom                   # 里程计坐标系名称
    map_frame: map                      # 地图坐标系名称
    base_frame: body                    # 机器人基座坐标系名称
    scan_topic: /scan                   # 激光雷达扫描话题
    use_map_saver: true                 # 启用地图保存功能
    mode: mapping                       # 运行模式：建图模式（可选 localization 定位模式）

    # 是否从已有地图开始建图
    #map_file_name: test_steve          # 要加载的地图文件名
    # map_start_pose: [0.0, 0.0, 0.0]   # 地图起始位姿 [x, y, yaw]
    #map_start_at_dock: true            # 是否在充电桩位置启动

    # ==================== 调试与发布参数 ====================
    debug_logging: false                # 调试日志开关
    throttle_scans: 1                   # 扫描节流：每1帧处理一次
    transform_publish_period: 0.02      # TF变换发布周期（秒），0则不发布里程计
    map_update_interval: 3.0            # 地图更新间隔（秒）
    resolution: 0.05                    # 地图分辨率（米/像素）
    restamp_tf: false                   # 是否重新加盖TF时间戳
    min_laser_range: 0.05               # 激光雷达最小有效距离（米），过滤近处噪点
    max_laser_range: 12.0               # 激光雷达最大有效距离（米）
    minimum_time_interval: 0.5          # 最小处理时间间隔（秒）
    transform_timeout: 0.2              # TF变换超时时间（秒）
    tf_buffer_duration: 30.0            # TF缓冲区持续时间（秒）
    stack_size_to_use: 40000000         # 堆栈大小（字节），用于序列化大地图
    enable_interactive_mode: true       # 启用交互模式（可在RViz中手动调整位姿）

    # ==================== 通用建图参数 ====================
    use_scan_matching: true             # 启用扫描匹配
    use_scan_barycenter: true           # 启用扫描重心计算
    minimum_travel_distance: 0.3        # 最小移动距离（米），低于此值不添加新节点
    minimum_travel_heading: 0.15        # 最小移动角度（弧度），低于此值不添加新节点
    check_min_dist_and_heading_precisely: false  # 是否精确检查最小距离和角度
    scan_buffer_size: 20                # 扫描缓冲区大小
    scan_buffer_maximum_scan_distance: 10.0  # 扫描缓冲区最大扫描距离（米）
    link_match_minimum_response_fine: 0.1     # 链接匹配最小精细响应值
    link_scan_maximum_distance: 1.5           # 链接扫描最大距离（米）
    loop_search_maximum_distance: 5.0         # 回环检测最大搜索距离（米）
    do_loop_closing: true                     # 启用回环闭合检测
    loop_match_minimum_chain_size: 10         # 回环匹配最小链大小
    loop_match_maximum_variance_coarse: 3.0   # 回环粗匹配最大方差
    loop_match_minimum_response_coarse: 0.35  # 回环粗匹配最小响应值
    loop_match_minimum_response_fine: 0.45    # 回环精细匹配最小响应值

    # ==================== 相关性扫描匹配参数 ====================
    # 扫描匹配搜索参数
    correlation_search_space_dimension: 0.3        # 相关性搜索空间维度
    correlation_search_space_resolution: 0.01      # 相关性搜索空间分辨率
    correlation_search_space_smear_deviation: 0.1  # 相关性搜索空间扩散偏差

    # ==================== 回环闭合参数 ====================
    loop_search_space_dimension: 8.0               # 回环搜索空间维度
    loop_search_space_resolution: 0.05             # 回环搜索空间分辨率
    loop_search_space_smear_deviation: 0.03        # 回环搜索空间扩散偏差

    # ==================== 扫描匹配器参数 ====================
    distance_variance_penalty: 0.5                 # 距离方差惩罚系数
    angle_variance_penalty: 1.0                    # 角度方差惩罚系数

    fine_search_angle_offset: 0.00349              # 精细搜索角度偏移（弧度）
    coarse_search_angle_offset: 0.349              # 粗搜索角度偏移（弧度）
    coarse_angle_resolution: 0.0349                # 粗搜索角度分辨率（弧度）
    minimum_angle_penalty: 0.9                     # 最小角度惩罚值
    minimum_distance_penalty: 0.5                  # 最小距离惩罚值
    use_response_expansion: true                   # 启用响应扩展
    min_pass_through: 2                            # 最小通过次数（占据栅格阈值）
    occupancy_threshold: 0.1                       # 占据概率阈值